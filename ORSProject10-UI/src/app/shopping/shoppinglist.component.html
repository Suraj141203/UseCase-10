<app-navbar></app-navbar>

<style>
  #nnn {
    background: none;
    border: none;
    cursor: pointer;
  }

  .panel-heading {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-inputs {
    margin-top: 20px;
  }

  .search-inputs .form-control,
  .search-inputs .btn {
    margin-bottom: 10px;
  }

  .content-wrapper {
    background: url('assets/files/teahu.png') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
    width: auto;
    height: 105vh;
    padding: 20px;
  }

  .table-responsive {
    margin-top: 20px;
  }

  .search-inputs .col-sm-2,
  .search-inputs .col-sm-1 {
    padding: 0 5px;
  }

  .alertRedColor {
    color: red;
  }
</style>

<div class="content-wrapper">
  <div class="container-fluid">
    <div class="panel panel-primary" style="padding-top: 12%;">

      <!-- HEADER -->
      <div class="panel-heading">
        <h1 class="text-primary font-weight-bold">
          Shopping List
        </h1>
      </div>

      <!-- SEARCH SECTION -->
      <div class="row search-inputs p-1 justify-content-center g-3">

        <div class="col-sm-2">
          <input type="text" name="productName" [(ngModel)]="form.searchParams.productName" class="form-control"
            placeholder="Enter Product Name">
        </div>

        <div class="col-sm-2">
          <input type="text" name="productPrice" [(ngModel)]="form.searchParams.productPrice" class="form-control"
            placeholder="Enter Product Price">
        </div>

        <div class="col-sm-2">
          <input type="text" name="shopName" [(ngModel)]="form.searchParams.shopName" class="form-control"
            placeholder="Enter Shop Name">
        </div>

        <div class="col-sm-2">
          <input type="date" name="dob" [(ngModel)]="form.searchParams.dob" class="form-control">
        </div>

        <div class="col-sm-1">
          <button (click)="search()" class="btn btn-primary w-100">
            Search
          </button>
        </div>

        <div>
          <button (click)="forward('/shopping')" type="button" class="btn btn-success w-100">
            Add Shopping
          </button>
        </div>

        <div class="col-sm-1">
          <button (click)="deleteMany()" class="btn btn-danger w-100">
            Delete
          </button>
        </div>

      </div>

      <!-- MESSAGE SECTION -->
      <div *ngIf="form.error" class="alert alert-danger alert-dismissible">
        <button type="button" class="close" data-dismiss="alert">&times;</button>
        {{ form.message }}
      </div>

      <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible">
        <button type="button" class="close" data-dismiss="alert">&times;</button>
        {{ form.message }}
      </div>

      <!-- TABLE SECTION -->
      <div class="table-responsive">
        <table class="table table-bordered table-hover table-dark">
          <thead class="thead-dark text-uppercase">
            <tr align="center">

              <!-- MASTER CHECKBOX -->
              <th>
                <input type="checkbox" [(ngModel)]="isMasterSel" name="list_name" (change)="checkUncheckAll($event)" />
              </th>

              <th>S.No</th>
              <th>Product Name</th>
              <th>Product Price</th>
              <th>Shop Name</th>
              <th>Purchase Date</th>
              <th>Edit</th>

            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let m of form.list; let i = index" align="center">

              <!-- ROW CHECKBOX -->
              <td>
                <input type="checkbox" #checkboxes (change)="checklistUpdate()" name="list_name" [id]="m.id" />
              </td>

              <td>{{ (form.pageNo * 5) + i + 1 }}</td>
              <td>{{ m.productName }}</td>
              <td>{{ m.productPrice }}</td>
              <td>{{ m.shopName }}</td>
              <td>{{ m.dob | date:'yyyy-MM-dd' }}</td>

              <!-- EDIT BUTTON -->
              <td>
                <button class="fa fa-edit text-primary" id="nnn" (click)="forward('/shopping/' + m.id)">
                </button>
              </td>

            </tr>
          </tbody>
        </table>
      </div>

      <!-- PAGINATION -->
      <div class="d-flex justify-content-between mt-3">

        <button (click)="previous()" [disabled]="form.pageNo == 0" class="btn btn-info">
          Previous
        </button>

        <div>
          <a class="btn btn-warning mr-1" [routerLink]="['/shoppinglist']" (click)="exit()">
            Reset
          </a>
        </div>

        <div *ngIf="form.list.length == 0">
          <a class="btn btn-warning mr-1" [routerLink]="['/shoppinglist']" (click)="exit()">
            Back
          </a>
        </div>

        <button (click)="next()" [disabled]="nextList == 0" class="btn btn-info">
          Next
        </button>

      </div>

    </div>
  </div>
</div>

<app-footer></app-footer>
